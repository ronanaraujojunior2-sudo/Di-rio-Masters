<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diário de Bordo – Masters Engenharia</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#394086">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diário Masters">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--az:#394086;--vm:#d81313;--bg:#f4f5fa;--bd:#d6d9e8}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 Arial,Helvetica,sans-serif;background:var(--bg);color:#1c1f33;padding-bottom:env(safe-area-inset-bottom)}
#splash{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9;transition:opacity .4s}
#splash img{width:min(80vw,420px)}
header{background:#fff;border-bottom:4px solid var(--vm);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:12px}
header img{height:38px;max-width:60vw}header h1{font-size:15px;margin:0 0 0 auto;color:var(--az);text-align:right}
main{max-width:1100px;margin:0 auto;padding:12px}
section{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:15px;color:var(--az)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:12px;color:#555;font-weight:bold}
input,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:6px;margin-top:3px;background:#fff}
.w{grid-column:1/-1}.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:#1c1f33}.ck input{width:22px;height:22px;margin:0}
button{font:inherit;font-weight:bold;border:0;border-radius:8px;padding:11px 14px;background:var(--az);color:#fff}
button.s{background:#fff;color:var(--az);border:1px solid var(--az)}button.d{background:var(--vm)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
th{background:var(--az);color:#fff;padding:6px;text-align:left}td{border:1px solid var(--bd);padding:6px}tr.r:nth-child(even){background:#f7f8fc}
tfoot td{font-weight:bold;background:#eceefa}#err{color:var(--vm);font-weight:bold;margin-top:8px}.hint{font-size:12px;color:#555}
.ph{display:none}
@media print{@page{size:A4 landscape;margin:8mm}body{background:#fff}#splash,.np,.bar,button{display:none!important}.ph{display:block}section{border:0;padding:0}table{min-width:0;font-size:10px}td:last-child.ac,th.ac{display:none}}
</style></head><body>
<div id="splash"><img src="logo-masters.svg" alt="Master's Engenharia"></div>
<header><img src="logo-masters.svg" alt="Master's Engenharia"><h1>Controle de Utilização de Veículo</h1></header>
<main>
<section class="np"><h2>Dados do veículo</h2><div class="g" id="hf"></div></section>
<section class="np"><h2 id="ft">Novo registro</h2><div class="g" id="rf"></div>
<div class="ck w" style="margin-top:10px"><input type="checkbox" id="visto"><label for="visto" style="font-size:14px;color:inherit">Visto do motorista: confirmo que as informações estão corretas</label></div>
<div id="err"></div><div class="bar"><button id="add">Salvar registro</button><button class="s" id="cancel" hidden>Cancelar edição</button></div></section>
<section><h2>Registros</h2><div class="ph" id="ph"></div><div class="tw"><table><thead><tr><th>DATA</th><th>KM SAÍDA</th><th>KM CHEGADA</th><th>HORA SAÍDA</th><th>HORA CHEGADA</th><th>ORIGEM / DESTINO</th><th>NOME MOTORISTA</th><th>VISTO</th><th>FINALIDADE</th><th>USUÁRIO</th><th>KM RODADO</th><th class="ac np"></th></tr></thead><tbody id="tb"></tbody><tfoot><tr><td colspan="10" style="text-align:right">Total (KM rodado)</td><td id="tot" colspan="2">0</td></tr></tfoot></table></div>
<label style="margin-top:10px">Observações<textarea id="obs" rows="3"></textarea></label>
<div class="bar np"><button id="xl">Exportar Excel</button><button class="s" id="csv">Exportar CSV</button><button class="s" id="pr">Imprimir / PDF</button><button class="s" id="inst" hidden>Instalar aplicativo</button></div>
<p class="hint np" id="ios" hidden>iPhone: toque em Compartilhar e depois em “Adicionar à Tela de Início”.</p></section>
</main>
<script>
const K='masters-diario-v1',$=s=>document.querySelector(s);
let S=JSON.parse(localStorage.getItem(K)||'null')||{h:{veiculo:'FIAT MOBI',placa:'TYD5C39'},r:[],obs:''},ed=-1;
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const H=[['veiculo','Veículo','text'],['placa','Placa','text'],['kmFinal','Km Final','number'],['dIni','Data Início','date'],['dFim','Data Final','date'],['kmOleo','KM Troca Óleo','number'],['dOleo','Data Troca Óleo','date']];
const F=[['data','Data','date'],['kmS','KM saída','number'],['kmC','KM chegada','number'],['hS','Hora saída','time'],['hC','Hora chegada','time'],['od','Origem / Destino','text','w'],['mot','Nome do motorista (legível)','text'],['fin','Finalidade','text'],['usu','Usuário','text']];
const fd=d=>d?d.split('-').reverse().join('/'):'',km=r=>(r.kmS!==''&&r.kmC!==''&&r.kmS!=null&&r.kmC!=null)?r.kmC-r.kmS:null;
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#hf').innerHTML=H.map(([k,l,t])=>`<label>${l}<input id="h_${k}" type="${t}" inputmode="${t=='number'?'numeric':''}"></label>`).join('');
$('#rf').innerHTML=F.map(([k,l,t,w])=>`<label class="${w||''}">${l}<input id="f_${k}" type="${t}" ${t=='number'?'inputmode="numeric" min="0"':''}></label>`).join('');
H.forEach(([k])=>{const e=$('#h_'+k);e.value=S.h[k]||'';e.oninput=()=>{S.h[k]=e.value;save();head()}});
$('#obs').value=S.obs;$('#obs').oninput=e=>{S.obs=e.target.value;save()};
function head(){$('#ph').innerHTML=`<b>Veículo:</b> ${esc(S.h.veiculo)} &nbsp; <b>Placa:</b> ${esc(S.h.placa)} &nbsp; <b>Km Final:</b> ${esc(S.h.kmFinal)} &nbsp; <b>Período:</b> ${fd(S.h.dIni)} a ${fd(S.h.dFim)} &nbsp; <b>KM Troca Óleo:</b> ${esc(S.h.kmOleo)} &nbsp; <b>Data Troca Óleo:</b> ${fd(S.h.dOleo)}`}
function draw(){let t=0;$('#tb').innerHTML=S.r.map((r,i)=>{const k=km(r);if(k>0)t+=k;return `<tr class="r"><td>${fd(r.data)}</td><td>${esc(r.kmS)}</td><td>${esc(r.kmC)}</td><td>${esc(r.hS)}</td><td>${esc(r.hC)}</td><td>${esc(r.od)}</td><td>${esc(r.mot)}</td><td>${r.visto?'✔':''}</td><td>${esc(r.fin)}</td><td>${esc(r.usu)}</td><td>${k??''}</td><td class="ac np"><button class="s" onclick="editR(${i})">Editar</button> <button class="d" onclick="delR(${i})">×</button></td></tr>`}).join('')||'<tr><td colspan="12">Nenhum registro.</td></tr>';$('#tot').textContent=t;head()}
function clr(){F.forEach(([k])=>$('#f_'+k).value='');$('#visto').checked=false;ed=-1;$('#ft').textContent='Novo registro';$('#cancel').hidden=true;$('#add').textContent='Salvar registro';$('#err').textContent='';
 const l=S.r.at(-1);if(l){$('#f_kmS').value=l.kmC;['mot','usu'].forEach(k=>$('#f_'+k).value=l[k]||'')}$('#f_data').value=new Date().toLocaleDateString('sv')}
window.editR=i=>{const r=S.r[i];F.forEach(([k])=>$('#f_'+k).value=r[k]??'');$('#visto').checked=!!r.visto;ed=i;$('#ft').textContent='Editando registro';$('#cancel').hidden=false;$('#add').textContent='Atualizar registro';scrollTo(0,0)};
window.delR=i=>{if(confirm('Excluir este registro?')){S.r.splice(i,1);save();draw()}};
$('#cancel').onclick=clr;
$('#add').onclick=()=>{const r={visto:$('#visto').checked};F.forEach(([k,,t])=>{const v=$('#f_'+k).value.trim();r[k]=t=='number'&&v!==''?Number(v):v});
 let e='';if(!r.data)e='Informe a data.';else if(r.kmS===''||r.kmC==='')e='Informe KM de saída e de chegada.';else if(r.kmC<r.kmS)e='KM de chegada não pode ser menor que o KM de saída.';else if(!r.od)e='Informe origem / destino.';
 $('#err').textContent=e;if(e)return;ed>=0?S.r[ed]=r:S.r.push(r);save();draw();clr()};
const rows=()=>S.r.map(r=>[fd(r.data),r.kmS,r.kmC,r.hS,r.hC,r.od,r.mot,r.visto?'OK':'',r.fin,r.usu]);
const HD=['DATA','KM SAÍDA','KM CHEGADA','HORA SAÍDA','HORA CHEGADA','ORIGEM / DESTINO','NOME MOTORISTA (legível)','VISTO MOTORISTA','FINALIDADE','USUÁRIO'];
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const nm=()=>`diario-bordo-${(S.h.placa||'veiculo').replace(/\W/g,'')}-${new Date().toLocaleDateString('sv')}`;
$('#csv').onclick=()=>{const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;const L=[['Controle de Utilização Veículo'],['Veículo',S.h.veiculo,'Placa',S.h.placa,'Km Final',S.h.kmFinal,'Data Início',fd(S.h.dIni),'Data Final',fd(S.h.dFim),'KM Troca Óleo',S.h.kmOleo,'Data Troca Óleo',fd(S.h.dOleo)],HD.concat('KM RODADO'),...S.r.map((r,i)=>rows()[i].concat(km(r)??'')),['Total (KM rodado)',$('#tot').textContent],['Observações',S.obs]];
 dl(new Blob(['\ufeff'+L.map(l=>l.map(q).join(';')).join('\r\n')],{type:'text/csv'}),nm()+'.csv')};
function ldX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
$('#xl').onclick=async()=>{try{await ldX()}catch(e){alert('Excel indisponível sem internet na primeira vez. Use o CSV ou tente novamente online.');return}
 const n=Math.max(19,S.r.length),a=4+n-1,h=S.h,A=[['Controle de Utilização Veículo',,,,,,,,,'KM Troca Óleo: '+(h.kmOleo||'')],['Veículo: '+(h.veiculo||''),,'Placa: '+(h.placa||''),,,'Km Final: '+(h.kmFinal||''),'Data Início: '+fd(h.dIni),,'Data Final: '+fd(h.dFim),'Data Troca Óleo: '+fd(h.dOleo)],HD];
 for(let i=0;i<n;i++)A.push(S.r[i]?rows()[i]:[]);let t=0;S.r.forEach(r=>{const k=km(r);if(k>0)t+=k});
 A.push([,'Total',{t:'n',v:t,f:`SUMPRODUCT((B4:B${a}<>"")*(C4:C${a}<>"")*(C4:C${a}-B4:B${a}))`}]);A.push(['Observações: '+S.obs]);
 const ws=XLSX.utils.aoa_to_sheet(A),L=A.length-1;ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:8}},{s:{r:1,c:0},e:{r:1,c:1}},{s:{r:1,c:3},e:{r:1,c:4}},{s:{r:1,c:6},e:{r:1,c:7}},{s:{r:L,c:0},e:{r:L,c:9}}];
 ws['!cols']=[12,14,18,12,14,42,20,13,35,23].map(w=>({wch:w}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Diario de Bordo');XLSX.writeFile(wb,nm()+'.xlsx')};
$('#pr').onclick=()=>print();
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{dp.prompt();await dp.userChoice;$('#inst').hidden=true};
if(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone)$('#ios').hidden=false;
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
setTimeout(()=>{$('#splash').style.opacity=0;setTimeout(()=>$('#splash').remove(),450)},1100);
draw();clr();
</script></body></html>
